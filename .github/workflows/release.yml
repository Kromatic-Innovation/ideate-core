name: Release

# ⚠️  CANONICAL TEMPLATE — DO NOT HAND-EDIT PER REPO.
#
# This is the single source of truth for `release.yml` (npm publish) across
# every Internal Platform repo that publishes to npm (registry
# `publishingScheme: npm` — currently ideate-core / panelist / tickle-stick).
# It is versioned in code-workspace-config at `templates/release-npm.yml` and
# synced into each npm repo by `scripts/sync_promote_workflows.py` (mirror of
# `derive_repo_configs.py` / the `promote-main.yml` sync). A CI drift-check
# (`code-workspace-config/.github/workflows/promote-workflow-drift.yml`) reports
# divergence between a repo's committed copy and this canonical content.
#
# To change the npm publish flow, edit THIS template and re-run the sync
# script — never hand-edit a repo's `.github/workflows/release.yml`.
# cwc#1559 / cwc#1439. End home: cron-fleet (rides cwc#1107).
#
# ─── Why template-and-sync, not a cross-repo reusable workflow ───────────────
#
# The earlier design (cwc#1439) centralised these steps into a reusable
# `workflow_call` in cwc referenced at runtime as
# `Kromatic-Innovation/code-workspace-config/.github/workflows/npm-oidc-publish.yml@main`.
# That CANNOT work: cwc is a PRIVATE repo with `actions/permissions/access`
# = `none`, while every consumer (ideate-core / panelist / tickle-stick) is
# PUBLIC. tickle-stick#111 proved it — the migration merged, passed PR CI, and
# then failed at dispatch with `workflow was not found` (an access failure, not
# a missing file). Granting four public repos runtime access into the private
# governance repo is a security-posture change, not a config tweak. So instead
# we template-and-sync, exactly like `promote-main.yml` (cwc#1468):
#
#   - No cross-repo runtime access → public/private visibility is irrelevant.
#   - No new private-repo exposure.
#   - No OIDC caller ambiguity. npm Trusted Publishing validates the CALLING
#     workflow's filename, so keeping the publish inline in each repo's own
#     `release.yml` keeps the existing Trusted Publisher configuration valid.
#
# The trade-off (each repo carries a copy) is made safe by the drift-check —
# the same trade the fleet already accepted for `promote-main.yml`.
#
# This template is repo-agnostic: `npm publish` reads the package name from the
# repo's own `package.json`, and Trusted Publishing keys on the `release.yml`
# filename (identical across every repo), so the same bytes publish the correct
# package in whichever repo they land in. Authored from tickle-stick's
# known-good inline `release.yml` (the v0.6.x publisher).
#
# Actions pinned to full commit SHAs (not mutable tags). A compromised
# maintainer of any upstream action can retag `v6`/`release/v1`/etc. and
# push malicious code into our next release, which our trusted-publishing
# identity would then happily sign. SHA pins make action content
# immutable — upgrades are explicit PRs, not silent.
# Comment after each pin records the semver tag the SHA corresponded to
# at pin time, for human-readable version tracking.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-and-publish:
    name: Build + publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write         # npm provenance attestations via OIDC
    steps:
      # fetch-depth: 0 — the "tag is on merged code" assertion below needs the
      # full history to test ancestry of the tagged SHA against origin/main.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      # Gap 2 (cwc#1821): the tag was never checked against package.json, so
      # tagging `v9.9.9` on a tree whose manifest says `0.3.1` published `0.3.1`
      # under a `v9.9.9` tag. Fail the release when the tag name (minus its
      # leading `v`) disagrees with the manifest version. Repo-agnostic — reads
      # the version from whichever package.json is checked out.
      - name: Verify tag matches package.json version
        run: |
          set -euo pipefail
          PKG_VERSION="$(node -p "require('./package.json').version")"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Release tag '${GITHUB_REF_NAME}' disagrees with package.json version '${PKG_VERSION}'. Tag the commit whose manifest matches, or bump package.json before tagging."
            exit 1
          fi
          echo "OK: tag '${GITHUB_REF_NAME}' matches package.json version '${PKG_VERSION}'."

      # Gap 3 (cwc#1821): `on: push: tags: "v*"` fires from ANY ref, so a tag on
      # an unmerged feature branch would publish to public npm without the code
      # ever reaching develop or CI. Constraining the trigger to a branch is not
      # possible for tag pushes, so we assert the stronger property directly: the
      # tagged commit must be reachable from origin/main (i.e. it has been merged
      # and promoted). develop-main repos release from main, so this holds for a
      # legitimate release and rejects a tag on unmerged code.
      - name: Assert tagged commit is merged (ancestor of origin/main)
        run: |
          set -euo pipefail
          git fetch --no-tags --prune origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tagged commit ${GITHUB_SHA} is not an ancestor of origin/main. Publish only from tags on merged, promoted code."
            exit 1
          fi
          echo "OK: tagged commit ${GITHUB_SHA} is reachable from origin/main."

      # Trusted publishing requires npm >= 11.5.1 — Node 20 ships npm 10.x,
      # which signs provenance attestations but doesn't perform the
      # OIDC↔registry token exchange. Pin to the npm 11 line: `npm@latest`
      # is now npm 12, which dropped Node 20 (requires node >=22) and fails
      # this step with EBADENGINE. npm 11.x still supports Node 20
      # (^20.17.0) and satisfies the >= 11.5.1 trusted-publishing floor.
      - name: Upgrade npm to support trusted publishing
        run: |
          npm install -g npm@11
          npm --version

      - name: Install
        run: npm ci

      # `--if-present` so the SAME bytes work for a `tsc` package (runs the
      # build) and a build-less pure-ESM package (a no-op, exit 0) alike.
      # ideate-core and panelist declare no `build` script — an unconditional
      # `npm run build` fails them with `Missing script: "build"`. Byte-match
      # is what the drift-check asserts, so the conditional lives in the
      # canonical template, never as a per-repo stub build script. cwc#1590.
      - name: Build
        run: npm run build --if-present

      # Gap 1 (cwc#1821): the release published with NO test step, so provenance
      # signed a broken-but-untested artifact with a trusted identity — and npm
      # forbids re-publishing an unpublished version (unpublish only within 72h).
      # `--if-present` mirrors the Build step above: a repo WITH a test script
      # (the real concern — a tested package whose tests regressed) runs and
      # gates on it, while a build-less/test-less package stays a no-op exit 0,
      # so the same bytes are correct across every npm repo. Byte-match is what
      # the drift-check asserts, so the conditional lives in the canonical
      # template, never as a per-repo stub.
      - name: Test
        run: npm run test --if-present

      - name: Verify package contents
        run: npm pack --dry-run

      # npm Trusted Publishing (OIDC) via the publisher configured on
      # npmjs.com for each package (owner Kromatic-Innovation, the package's
      # own repo, workflow release.yml). No NPM_TOKEN secret is present
      # anywhere — org or repo. CI logs show "Signed provenance statement
      # ... from GitHub Actions" with no stored credential of any kind.
      # OIDC detection needs npm >= 11.5.1 (see the upgrade step above); a
      # 404/ENEEDAUTH here is that floor not being met, not a broken
      # publisher. Confirmed working on tickle-stick since v0.4.1.
      #
      # Strip `publishConfig.registry` before publishing (cwc#1590; load-bearing,
      # named by cwc#1559's own scope and then dropped). A repo may set
      # `publishConfig.registry` (e.g. panelist pins its org-scoped GitHub
      # Packages copy for a separate `publish.yml`), and that field takes
      # precedence over setup-node's `registry-url` — so verbatim the template
      # would try to publish the PUBLIC unscoped package to the scoped registry
      # and fail. Deleting the key routes the trusted-publishing publish to
      # `registry.npmjs.org`. `npm pkg delete` on an absent key is a no-op, so
      # the same bytes are correct for repos with `publishConfig: null`
      # (ideate-core / tickle-stick) too.
      - name: Strip publishConfig.registry (publish to npmjs, not a scoped registry)
        run: npm pkg delete publishConfig.registry

      - name: Publish to npm
        run: npm publish --provenance --access public
