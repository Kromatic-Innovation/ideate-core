name: Release

# Publish ideate-core to the PUBLIC npm registry (Apache-2.0) on a v* tag.
#
# The publish logic — npm Trusted Publishing (OIDC, no NPM_TOKEN), the npm@11
# pin for the OIDC<->registry token exchange, publishConfig.registry stripping,
# provenance gating, and tag/version verification — now lives in
# code-workspace-config's reusable `npm-oidc-publish.yml` (cwc#1439). This file
# is the thin caller: a fix to the shared publish flow lands once in cwc and
# every OSS repo (panelist / ideate-core / tickle-stick) inherits it, ending the
# per-repo drift that motivated #66 (e.g. the publishConfig.registry strip that
# reached here but never reached panelist).
#
# Trusted Publishing is bootstrapped once per package: npm's Trusted Publisher
# can only attach to a package that already exists, so the first publish of a
# new name is a manual maintainer `npm publish`. ideate-core is already
# bootstrapped (v0.3.0 is live on npm). No stored secret is used anywhere; the
# OIDC token is minted at publish time from the `id-token: write` grant below.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Validate with npm publish --dry-run (no real publish)"
        type: boolean
        default: true

jobs:
  release:
    name: Publish to public npm
    # Permissions are NOT inherited into a called (reusable) workflow — the
    # caller job must grant them here or OIDC token minting + provenance fail.
    permissions:
      contents: read
      id-token: write
    uses: Kromatic-Innovation/code-workspace-config/.github/workflows/npm-oidc-publish.yml@main
    with:
      scope: "@kromatic-innovation"
      # ideate-core has zero dependencies and no build step; its tests run
      # directly against source. Skip install/build (the reusable defaults them
      # ON) to preserve the current workflow's behaviour exactly.
      install: false
      build: false
      test-command: "node --test lib/*.test.mjs"
      # Real publish on a v* tag push; --dry-run validation on manual dispatch.
      dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
