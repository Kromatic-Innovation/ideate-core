name: Secret Scan

# TruffleHog OSS — free on private org repos, no license key required (unlike
# the licensed gitleaks-action). Scans the PR diff on every pull request and the
# full history on a weekly schedule. ci-config only (no deploy surface).

on:
  pull_request:
    branches: [develop]
  schedule:
    - cron: "27 6 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  trufflehog:
    name: TruffleHog
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Scan for secrets
        uses: trufflesecurity/trufflehog@bcfcf73aaf4759d4dadc2783177c245a02792318 # v3.97.0
        with:
          extra_args: --results=verified,unknown
