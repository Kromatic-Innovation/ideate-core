name: Release

# ⚠️  CANONICAL TEMPLATE — DO NOT HAND-EDIT PER REPO.
#
# This is the single source of truth for `release.yml` (npm publish) across
# every Internal Platform repo that publishes to npm (registry
# `publishingScheme: npm` — currently ideate-core / panelist /
# aux-comprehension-test).
# It is versioned in code-workspace-config at `templates/release-npm.yml` and
# synced into each npm repo by `scripts/sync_promote_workflows.py` (mirror of
# `derive_repo_configs.py` / the `promote-main.yml` sync).
#
# THIS COPY IS GENERATED. If you are reading this in a consumer repo, do not
# hand-edit it — the next sync overwrites any local change with canonical
# content again. Edit `templates/release-npm.yml` in code-workspace-config
# instead.
#
# Enforcement is PRODUCER-SIDE, in cwc, not in this consumer repo:
#   `code-workspace-config/.github/workflows/promote-workflow-drift.yml`
#   (`--check --workflow release-npm`) reports divergence between a repo's
#   committed copy and this canonical content, but that check only inspects
#   npm-publisher repos that happen to be checked out alongside cwc — it does
#   not run in this repo's own CI and has no visibility into this copy from
#   here. In cwc's own (single-repo) CI it inspects zero repos by design; a
#   full-workspace `--check` is what actually catches drift in ideate-core /
#   panelist / aux-comprehension-test. If this file has drifted, the fix is a re-sync
#   from cwc, never a local edit.
#
# To change the npm publish flow, edit THIS template and re-run the sync
# script — never hand-edit a repo's `.github/workflows/release.yml`.
#
# After the npm publish, this workflow also creates the GitHub Release object
# for the tag, using that version's own `CHANGELOG.md` section as the body
# (tickle-stick#184). Without it the Releases tab drifts behind the registry:
# tickle-stick advertised v0.5.0 as "Latest" while npm served 0.6.3.
# cwc#1559 / cwc#1439. End home: cron-fleet (rides cwc#1107).
#
# ─── Why template-and-sync, not a cross-repo reusable workflow ───────────────
#
# The earlier design (cwc#1439) centralised these steps into a reusable
# `workflow_call` in cwc referenced at runtime as
# `Kromatic-Innovation/code-workspace-config/.github/workflows/npm-oidc-publish.yml@main`.
# That CANNOT work: cwc is a PRIVATE repo with `actions/permissions/access`
# = `none`, while every consumer (ideate-core / panelist / tickle-stick) is
# PUBLIC. tickle-stick#111 proved it — the migration merged, passed PR CI, and
# then failed at dispatch with `workflow was not found` (an access failure, not
# a missing file). Granting four public repos runtime access into the private
# governance repo is a security-posture change, not a config tweak. So instead
# we template-and-sync, exactly like `promote-main.yml` (cwc#1468):
#
#   - No cross-repo runtime access → public/private visibility is irrelevant.
#   - No new private-repo exposure.
#   - No OIDC caller ambiguity. npm Trusted Publishing validates the CALLING
#     workflow's filename, so keeping the publish inline in each repo's own
#     `release.yml` keeps the existing Trusted Publisher configuration valid.
#
# The trade-off (each repo carries a copy) is made safe by the drift-check —
# the same trade the fleet already accepted for `promote-main.yml`.
#
# This template is repo-agnostic: `npm publish` reads the package name from the
# repo's own `package.json`, and Trusted Publishing keys on the `release.yml`
# filename (identical across every repo), so the same bytes publish the correct
# package in whichever repo they land in. Authored from tickle-stick's
# known-good inline `release.yml` (the v0.6.x publisher).
#
# Actions pinned to full commit SHAs (not mutable tags). A compromised
# maintainer of any upstream action can retag `v6`/`release/v1`/etc. and
# push malicious code into our next release, which our trusted-publishing
# identity would then happily sign. SHA pins make action content
# immutable — upgrades are explicit PRs, not silent.
# Comment after each pin records the semver tag the SHA corresponded to
# at pin time, for human-readable version tracking.

# Three jobs, least privilege. No job holds both `contents: write` and
# `id-token: write`, and no job that holds either one runs install, build or
# test code:
#
#   test       contents: read only. Tag/version and ancestor-of-main checks,
#              `npm ci`, build, tests, then `npm pack`. Uploads the exact
#              tarball it built and tested as an artifact.
#   publish    needs: test. contents: read + id-token: write (the npm OIDC
#              identity), in the `release` environment. Downloads the tarball
#              and runs `npm publish <tarball> --provenance`. No checkout, no
#              install from the registry, no repo scripts.
#   gh-release needs: publish. contents: write only. Creates the GitHub
#              Release from the tag's CHANGELOG.md section.
#
# The `release` environment is where a repo admin can require a reviewer
# before anything is published. GitHub creates an environment named in a
# workflow on first use, with no protection rules, so this file works before
# that configuration exists. If the package's Trusted Publisher entry on
# npmjs.com names an environment, it must be `release`; an entry with no
# environment matches any.
#
# npm: the publish job uses the npm bundled with Node 24 (11.19.x on
# `ubuntu-latest` at the time of writing), which is above the Trusted
# Publishing floor (npm >= 11.5.1). The alternative, `npm install -g npm@X`,
# fetches npm from the registry by version with no integrity check (Scorecard
# Pinned-Dependencies) and would run registry code inside the job that holds
# the publish identity. A step fails fast if the bundled npm is ever below the
# floor, before anything is published.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  test:
    name: Verify, build + test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # fetch-depth: 0 — the "tag is on merged code" assertion below needs the
      # full history to test ancestry of the tagged SHA against origin/main.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      # Gap 2 (cwc#1821): the tag was never checked against package.json, so
      # tagging `v9.9.9` on a tree whose manifest says `0.3.1` published `0.3.1`
      # under a `v9.9.9` tag. Fail the release when the tag name (minus its
      # leading `v`) disagrees with the manifest version. Repo-agnostic — reads
      # the version from whichever package.json is checked out.
      - name: Verify tag matches package.json version
        run: |
          set -euo pipefail
          PKG_VERSION="$(node -p "require('./package.json').version")"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Release tag '${GITHUB_REF_NAME}' disagrees with package.json version '${PKG_VERSION}'. Tag the commit whose manifest matches, or bump package.json before tagging."
            exit 1
          fi
          echo "OK: tag '${GITHUB_REF_NAME}' matches package.json version '${PKG_VERSION}'."

      # Gap 3 (cwc#1821): `on: push: tags: "v*"` fires from ANY ref, so a tag on
      # an unmerged feature branch would publish to public npm without the code
      # ever reaching develop or CI. Constraining the trigger to a branch is not
      # possible for tag pushes, so we assert the stronger property directly: the
      # tagged commit must be reachable from origin/main (i.e. it has been merged
      # and promoted). develop-main repos release from main, so this holds for a
      # legitimate release and rejects a tag on unmerged code.
      - name: Assert tagged commit is merged (ancestor of origin/main)
        run: |
          set -euo pipefail
          git fetch --no-tags --prune origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tagged commit ${GITHUB_SHA} is not an ancestor of origin/main. Publish only from tags on merged, promoted code."
            exit 1
          fi
          echo "OK: tagged commit ${GITHUB_SHA} is reachable from origin/main."

      - name: Install
        run: npm ci

      # `--if-present` so the SAME bytes work for a `tsc` package (runs the
      # build) and a build-less pure-ESM package (a no-op, exit 0) alike.
      # ideate-core and panelist declare no `build` script — an unconditional
      # `npm run build` fails them with `Missing script: "build"`. Byte-match
      # is what the drift-check asserts, so the conditional lives in the
      # canonical template, never as a per-repo stub build script. cwc#1590.
      - name: Build
        run: npm run build --if-present

      # Gap 1 (cwc#1821): the release published with NO test step, so provenance
      # signed a broken-but-untested artifact with a trusted identity — and npm
      # forbids re-publishing an unpublished version (unpublish only within 72h).
      # `--if-present` mirrors the Build step above: a repo WITH a test script
      # gates on it, while a test-less package stays a no-op exit 0.
      - name: Test
        run: npm run test --if-present

      # Strip `publishConfig.registry` before packing (load-bearing).
      # A repo may set `publishConfig.registry` to pin an org-scoped registry
      # (e.g. GitHub Packages) for a separate publish path, and that field takes
      # precedence over setup-node's `registry-url` — so verbatim the template
      # would try to publish the PUBLIC unscoped package to the scoped registry
      # and fail. The key is now baked out of the packed manifest here, so the
      # publish job needs no repo checkout to do it. `npm pkg delete` on an
      # absent key is a no-op, so repos with `publishConfig: null` are fine too.
      - name: Strip publishConfig.registry (publish to npmjs, not a scoped registry)
        run: npm pkg delete publishConfig.registry

      # The tarball built and tested here is the exact artifact that gets
      # published; the publish job runs none of the repo's scripts.
      - name: Pack
        run: |
          set -euo pipefail
          mkdir -p release-pack
          npm pack --pack-destination release-pack
          ls -l release-pack

      - name: Upload package tarball
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-pack
          path: release-pack/*.tgz
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to npm
    needs: test
    runs-on: ubuntu-latest
    # Where a repo admin can require a reviewer before the publish runs.
    environment: release
    permissions:
      contents: read
      id-token: write         # npm provenance attestations via OIDC
    steps:
      # No checkout: this job publishes only the tarball `test` uploaded, so no
      # repo file and no repo script is present here.
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Require npm >= 11.5.1 for trusted publishing
        run: |
          set -euo pipefail
          npm --version
          node -e 'const v=process.argv[1].split(".").map(Number);const ok=v[0]>11||(v[0]===11&&(v[1]>5||(v[1]===5&&v[2]>=1)));if(!ok){console.error("::error::npm "+process.argv[1]+" is below 11.5.1 (needed for npm Trusted Publishing)");process.exit(1)}' "$(npm --version)"

      - name: Download package tarball
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-pack
          path: release-pack

      # npm Trusted Publishing (OIDC) via the publisher configured on
      # npmjs.com for each package (owner Kromatic-Innovation, the package's
      # own repo, workflow release.yml). No NPM_TOKEN secret is present
      # anywhere — org or repo. CI logs show "Signed provenance statement
      # ... from GitHub Actions" with no stored credential of any kind.
      # The workflow filename (release.yml) is what Trusted Publishing keys
      # on; splitting into jobs does not change it.
      - name: Publish to npm
        run: |
          set -euo pipefail
          shopt -s nullglob
          # Leading `./` is load-bearing: npm reads a bare `dir/name.tgz` as a
          # GitHub `owner/repo` shorthand (a git spec), not a local file.
          TARBALLS=(./release-pack/*.tgz)
          if [ "${#TARBALLS[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one tarball in release-pack/, found ${#TARBALLS[@]}."
            exit 1
          fi
          npm publish "${TARBALLS[0]}" --provenance --access public

  gh-release:
    name: Create GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      # `write`: creates the GitHub Release object. No other scope.
      contents: write
    steps:
      # Checkout is only for CHANGELOG.md (the release notes); no repo script
      # runs in this job. Credentials are not persisted into the workspace.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # Gap 4 (tickle-stick#184): the tag was published to npm but no GitHub
      # Release object was ever created, so a repo's Releases tab kept showing
      # whichever old version last got one by hand. tickle-stick sat
      # advertising v0.5.0 as "Latest" while npm correctly served 0.6.3 — two
      # public surfaces disagreeing about the current version, with the staler
      # one being the more prominent for anyone browsing the repo.
      #
      # Runs AFTER the publish, deliberately: the npm publish IS the release.
      # A Release object created before a failed publish would advertise a
      # version that does not exist on the registry — the same disagreement in
      # the opposite direction, and the more damaging one.
      #
      # Body is this version's own CHANGELOG.md section where one exists,
      # falling back to --generate-notes. The awk matches the Keep-a-Changelog
      # heading with index()==1 rather than a regex, so the dots in a version
      # are literal and `1.2.3` cannot match `1x2x3`; it stops at the next
      # `## [` heading.
      #
      # Idempotent: `gh release view` short-circuits when the Release already
      # exists, so re-running this workflow against an existing tag is a no-op
      # rather than a failure.
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists — nothing to do."
            exit 0
          fi

          VERSION="${TAG#v}"
          NOTES_FILE="$(mktemp)"
          if [ -f CHANGELOG.md ]; then
            awk -v ver="$VERSION" '
              index($0, "## [" ver "]") == 1 { f = 1; next }
              f && index($0, "## [") == 1 { exit }
              f { print }
            ' CHANGELOG.md > "$NOTES_FILE"
          fi

          # `make_latest=legacy`, sent explicitly through the REST API rather
          # than via `gh release create`.
          #
          # Neither `gh release create --latest` NOR omitting the flag gives
          # version-aware behaviour, and the second one is a trap:
          #
          #   * `gh` only sends `make_latest` when `--latest` is passed
          #     (`cmdutil.NilBoolFlag` leaves the pointer nil; the param is
          #     added only `if opts.IsLatest != nil`).
          #   * The REST API defaults an ABSENT `make_latest` to `true`
          #     ("Defaults to true for newly published releases").
          #
          # So omitting the flag lands on `true` exactly like passing it. gh's
          # own `--latest` help text advertises the default as "automatic based
          # on date and version" -- that describes `legacy`, which gh never
          # sends. Trusting that help text yields a no-op change that reads
          # like a fix.
          #
          # `legacy` is the value that actually means "determined based on the
          # release creation date and higher semantic version", and
          # `gh release create` has no flag that can express it -- `--latest`
          # is a bool. Hence the raw API call.
          #
          # Why it matters: a backport patch on an older line (tagging v0.5.4
          # once v0.6.x exists, ordinary OSS practice) would otherwise mark the
          # OLDER release "Latest", demoting the newer one and putting the
          # Releases tab back into the disagreement-with-npm state this step
          # exists to fix. The `gh release view` guard above does not help --
          # it short-circuits only when a Release already EXISTS for this tag,
          # and a fresh backport tag has none.
          if [ -s "$NOTES_FILE" ]; then
            echo "Using CHANGELOG.md section for $VERSION."
            gh api "repos/${GITHUB_REPOSITORY}/releases" \
              -X POST \
              -f tag_name="$TAG" \
              -f name="$TAG" \
              -f make_latest=legacy \
              -F body=@"$NOTES_FILE" \
              --jq '"Created release \(.tag_name) (make_latest=legacy): \(.html_url)"'
          else
            echo "::warning::No CHANGELOG.md section found for $VERSION; falling back to generated notes."
            gh api "repos/${GITHUB_REPOSITORY}/releases" \
              -X POST \
              -f tag_name="$TAG" \
              -f name="$TAG" \
              -f make_latest=legacy \
              -F generate_release_notes=true \
              --jq '"Created release \(.tag_name) (make_latest=legacy, generated notes): \(.html_url)"'
          fi
